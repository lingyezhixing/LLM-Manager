name: CI

# 开发基础设施,非运行时联网点:运行时仍是纯离线(GitHub Actions 仅作为质量门)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      # Windows:平台特定分支(devices LHM 降级链、runner 信号转发)需真实 Windows 环境,
      # 本地跑再多次也覆盖不了「全新机器」视角;frontend 侧 node 跨平台,无需矩阵。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Pyright
        run: pyright src/llm_manager
      - name: Pytest
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Oxlint
        run: npx oxlint src
      - name: Vitest
        run: npx vitest run
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build
