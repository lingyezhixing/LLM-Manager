<svg xmlns="http://www.w3.org/2000/svg" viewBox="76.7 50.4 346.6 399.2" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- 1. 背景六边形：深邃午夜暗夜蓝 -->
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f203d"/>
      <stop offset="45%" stop-color="#081427"/>
      <stop offset="100%" stop-color="#020710"/>
    </linearGradient>

    <!-- 2. 精密微光描边（全黑/全白任务栏完美适配） -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#1e3a8a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 3. “L” 竖向折叠面：纯粹白光 -> 冰霜微蓝（更加通透） -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fbff"/>
      <stop offset="70%" stop-color="#e6effd"/>
      <stop offset="100%" stop-color="#cce0ff"/>
    </linearGradient>

    <!-- 4. “L” 横向折叠面：深邃折痕 -> 电光流转 -> 纯净天青 -->
    <linearGradient id="baseGrad" x1="180" y1="355" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e224e"/>
      <stop offset="14%" stop-color="#15397f"/>
      <stop offset="32%" stop-color="#1d4ed8"/>
      <stop offset="58%" stop-color="#2563eb"/>
      <stop offset="82%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#99caff"/>
    </linearGradient>

    <!-- 5. 顶光微阴影（紧致细腻，绝不溢出边缘） -->
    <filter id="foldShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.8" dy="1.4" stdDeviation="1.6" flood-color="#020818" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. 正六边形背景：中心 (250,250)，外接圆 R=340/√3≈196.3，顶点 y=53.7/446.3、肩 y=151.9/348.1，
        六边等长 R；内角全 120°；圆角 R=12，切距 r·tan30°≈6.93，切线长度差 2.9% 已消除 -->
  <path d="
    M 244.0 57.2
    L 86.0 148.4
    Q 80 151.9 80 158.8
    L 80 341.2
    Q 80 348.2 86.0 351.6
    L 244.0 442.8
    Q 250 446.3 256.0 442.8
    L 414.0 351.6
    Q 420 348.2 420 341.2
    L 420 158.8
    Q 420 151.9 414.0 148.4
    L 256.0 57.2
    Q 250 53.7 244.0 57.2 
    Z" 
    fill="url(#bgGrad)"
    stroke="url(#rimGrad)"
    stroke-width="2.5" />

  <!-- 2. “L” 横向底部（平滑延伸，R=8 微倒角） -->
  <path d="
    M 180 355
    L 250 285
    H 332
    A 8 8 0 0 1 340 293
    V 347
    A 8 8 0 0 1 332 355
    Z" 
    fill="url(#baseGrad)" />

  <!-- 3. “L” 竖向上半部分（高光冰霜白，45° 自然覆叠） -->
  <path d="
    M 188 135
    H 242
    A 8 8 0 0 1 250 143
    V 285
    L 180 355
    V 143
    A 8 8 0 0 1 188 135 
    Z" 
    fill="url(#stemGrad)" 
    filter="url(#foldShadow)" />
</svg>
