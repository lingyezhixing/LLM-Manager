[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-manager"
version = "3.0.0a1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.104",
  "uvicorn[standard]>=0.24",
  "httpx>=0.25",
  "psutil>=5.9",
  "PyYAML",
  "pydantic>=2",
]

[project.optional-dependencies]
monitoring = ["pythonnet>=3"]
tray = ["pystray", "Pillow"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.12.7", "pyright", "httpx>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 仓库内 .py 仅分布于 src/ 与 tests/,默认扫描(include 默认 *.py)即全覆盖。
# 注意:0.12.7 多路径参数偶发丢诊断——验收用单路径 `ruff check .`,勿用 `ruff check src tests`。

[tool.pyright]
include = ["src/llm_manager"]
