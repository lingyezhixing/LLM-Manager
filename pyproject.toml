[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-manager"
version = "3.0.0a2"
requires-python = ">=3.11"
# 依赖全部 == 精确锁定(2026-08-06 升级至最新版后固定;升级需显式改版本 + 全量验证)。
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "httpx==0.28.1",
  "psutil==7.2.2",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
monitoring = ["pythonnet==3.1.0"]
tray = ["pystray==0.19.5", "Pillow==12.3.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1", "pyright==1.1.411", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]  # 使 tests/helpers.py 以 `from helpers import ...` 导入

[tool.ruff]
line-length = 100
target-version = "py311"
# 规则集跟随版本默认(riff 0.16.1 全套),版本在 dev 依赖中 == 固定——升级版本即
# 引入新规则,需显式处理。仓库内 .py 仅分布于 src/ 与 tests/,默认扫描即全覆盖。

[tool.pyright]
include = ["src/llm_manager"]
